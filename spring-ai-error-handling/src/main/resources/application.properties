spring.application.name=spring-ai-error-handling
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.model.embedding=none
spring.ai.ollama.init.pull-model-strategy=never

spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=200ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=1s
spring.ai.retry.on-client-errors=false

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=20s
spring.http.clients.imperative.factory=jdk
app.summary.stream-idle-timeout=20s
