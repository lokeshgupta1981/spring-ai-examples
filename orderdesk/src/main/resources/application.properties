spring.application.name=orderdesk

# Ollama runs on this computer; no API key is needed
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.2

# Chat memory is saved in a file database, so it survives a restart
spring.datasource.url=jdbc:hsqldb:file:./data/orderdesk
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Embedding model for RAG (ollama pull nomic-embed-text)
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Which vector store is active: simple (default, in memory), chroma, pgvector, redis or qdrant.
# The profiles application-chroma.properties and so on switch it.
spring.ai.vectorstore.type=simple

# Create the orders table (schema.sql) and its sample rows (data.sql) at every start
spring.sql.init.mode=always

# MCP server (Streamable HTTP at http://localhost:8080/mcp)
spring.ai.mcp.server.name=orderdesk
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.instructions=Look up OrderDesk orders and read the store's policies.

# Observability: metrics at /actuator/metrics; traces only with the observability profile
management.endpoints.web.exposure.include=health,metrics
management.tracing.export.enabled=false
