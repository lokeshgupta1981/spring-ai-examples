<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OrderDesk chat</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    #answer { white-space: pre-wrap; border: 1px solid #ccc; padding: 12px; min-height: 80px; }
  </style>
</head>
<body>
  <h1>OrderDesk</h1>
  <input id="question" size="60" value="Explain your delivery charges in two sentences.">
  <button onclick="askPlain()">Ask (plain text)</button>
  <button onclick="askJson()">Ask (JSON)</button>
  <p id="answer"></p>

  <script>
    const answer = document.getElementById("answer");
    const question = () => encodeURIComponent(document.getElementById("question").value);

    // Plain text events: the browser drops the space after "data:"
    function askPlain() {
      answer.textContent = "";
      const source = new EventSource("/stream?question=" + question());
      source.onmessage = (event) => answer.textContent += event.data;
      source.onerror = () => source.close();   // the server closed the stream
    }

    // JSON events: the space stays inside the "text" field
    function askJson() {
      answer.textContent = "";
      const source = new EventSource("/stream-json?question=" + question());
      source.onmessage = (event) => answer.textContent += JSON.parse(event.data).text;
      source.onerror = () => source.close();
    }
  </script>
</body>
</html>
