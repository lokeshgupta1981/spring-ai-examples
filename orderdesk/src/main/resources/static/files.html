<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OrderDesk: Chat with a File</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 30px auto; }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
    input[type=text] { width: 70%; padding: 6px; }
    #answer { white-space: pre-wrap; background: #f6f6f6; padding: 10px; min-height: 40px; }
  </style>
</head>
<body>
<h2>OrderDesk: Chat with a File</h2>

<section>
  <h3>1. Upload a file</h3>
  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
  <p id="status"></p>
</section>

<section>
  <h3>2. Ask a question</h3>
  <select id="fileId"></select>
  <button onclick="removeFile()">Delete file</button>
  <p><input type="text" id="question" placeholder="Your question">
     <button onclick="ask()">Ask</button></p>
  <div id="answer"></div>
</section>

<script>
  async function loadFiles() {
    const files = await (await fetch('/files')).json();
    document.getElementById('fileId').innerHTML = files
      .map(f => '<option value="' + f.fileId + '">' + f.fileName
        + ' (' + f.chunks + ' chunks)</option>')
      .join('');
  }

  async function upload() {
    const form = new FormData();
    form.append('file', document.getElementById('file').files[0]);
    document.getElementById('status').textContent = 'Uploading...';
    const file = await (await fetch('/files', { method: 'POST', body: form })).json();
    document.getElementById('status').textContent =
      'Saved ' + file.fileName + ' as ' + file.chunks + ' chunks (id ' + file.fileId + ')';
    await loadFiles();
  }

  async function ask() {
    const fileId = document.getElementById('fileId').value;
    const question = encodeURIComponent(document.getElementById('question').value);
    document.getElementById('answer').textContent = 'Thinking...';
    const answer = await (await fetch('/files/' + fileId + '/ask?question=' + question)).text();
    document.getElementById('answer').textContent = answer;
  }

  async function removeFile() {
    await fetch('/files/' + document.getElementById('fileId').value, { method: 'DELETE' });
    await loadFiles();
  }

  loadFiles();
</script>
</body>
</html>
