spring.application.name=orderdesk-dmr
server.port=8087

# Two chat models in one app, so we build the ChatClients ourselves
spring.ai.chat.client.enabled=false

# The local model, as in the other OrderDesk articles
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.temperature=0.2

# Docker Model Runner speaks the OpenAI API on localhost; any key works
spring.ai.openai.api-key=test
spring.ai.openai.base-url=http://localhost:12434/engines/v1
spring.ai.openai.chat.model=ai/gemma3
# Model Runner has no embedding model here; use Ollama's
spring.ai.model.embedding=ollama
spring.ai.openai.chat.temperature=0.2
