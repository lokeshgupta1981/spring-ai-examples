spring.application.name=orderdesk-mcp-client
server.port=8081

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.2

# The OrderDesk MCP server (start OrderDesk first)
spring.ai.mcp.client.name=orderdesk-mcp-client
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.streamable-http.connections.orderdesk.url=http://localhost:8080
