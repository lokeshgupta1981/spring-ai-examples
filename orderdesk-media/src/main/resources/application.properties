spring.application.name=orderdesk-media
server.port=8082

# Set the key as the environment variable SPRING_AI_OPENAI_API_KEY.
# Spring Boot maps it to spring.ai.openai.api-key, so it never goes into a file.

# Image generation
spring.ai.openai.image.model=gpt-image-1-mini
spring.ai.openai.image.size=1024x1024

# Text to speech
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=alloy
spring.ai.openai.audio.speech.response-format=mp3

# Speech to text
spring.ai.openai.audio.transcription.model=whisper-1
spring.ai.openai.audio.transcription.language=en

spring.servlet.multipart.max-file-size=10MB
