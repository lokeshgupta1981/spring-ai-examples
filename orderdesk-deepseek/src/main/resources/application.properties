spring.application.name=orderdesk-deepseek
server.port=8085

# Two chat models in one app, so we build the ChatClients ourselves
spring.ai.chat.client.enabled=false

# The local model, as in the other OrderDesk articles
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.temperature=0.2

# The key comes from the environment variable SPRING_AI_DEEPSEEK_API_KEY
spring.ai.deepseek.chat.model=deepseek-v4-flash
spring.ai.deepseek.chat.max-tokens=500
spring.ai.deepseek.chat.temperature=0.2
